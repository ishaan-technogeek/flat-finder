name: Deploy to GitHub Pages

# This fork publishes the Hyderabad map from its feature branch. Upstream deploys to Cloudflare Pages at the
# root of its own domain; GitHub Pages serves a project repo under /<repo>/, so the build is told that prefix
# and the app builds every data url and permalink from it.
on:
  push:
    branches: [feat/hyderabad]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and a newer commit supersedes a running one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npx vitest run --root .. cli web/src
      - name: Build
        working-directory: web
        # taken from the repository name rather than hardcoded, so a rename or a second fork still works
        run: PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
